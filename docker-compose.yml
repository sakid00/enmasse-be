# Local: API + Postgres. Caddy is not used here.
#   docker compose up --build -d
# Or run the API on the host: docker compose up -d postgres && go run ./cmd/api
#
# VPS: use docker-compose.prod.yml instead.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enmasse
    ports:
      - "5481:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enmasse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8081"
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/enmasse?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
