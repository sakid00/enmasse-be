# VPS A: API + Postgres + Caddy. Host ports are loopback-only except 80/443.
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Point DNS A/AAAA for api.$ENMASSE_DOMAIN and internal.api.$ENMASSE_DOMAIN at this VPS.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: enmasse
    ports:
      - "127.0.0.1:5481:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enmasse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8081"
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/enmasse?sslmode=disable
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      ENMASSE_DOMAIN: ${ENMASSE_DOMAIN:-enmasse.id}
      MASSMAKER_EGRESS_IP: ${MASSMAKER_EGRESS_IP:?set MASSMAKER_EGRESS_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  app:
