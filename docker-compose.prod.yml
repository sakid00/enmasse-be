# VPS1: API + Caddy. Postgres is DigitalOcean managed — set DATABASE_URL in .env.
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Point DNS A/AAAA for api.$ENMASSE_DOMAIN and internal.api.$ENMASSE_DOMAIN at this VPS.
# Do not start a local Postgres here. Compose must not override DATABASE_URL.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8081"
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      ENMASSE_DOMAIN: ${ENMASSE_DOMAIN:-enmasse.id}
      MASSMAKER_EGRESS_IP: ${MASSMAKER_EGRESS_IP:?set MASSMAKER_EGRESS_IP}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:

networks:
  app:
